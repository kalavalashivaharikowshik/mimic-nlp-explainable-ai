name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt

      - name: Install dependencies (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Frontend syntax check
        run: node --check frontend/script.js

      - name: Tests
        env:
          LOAD_MODEL_ON_STARTUP: "false"
        run: pytest

      - name: Server runs with the lean requirements only (no PyTorch)
        if: matrix.python-version == '3.11'
        run: |
          python -m venv /tmp/lean
          /tmp/lean/bin/pip install -q -r backend/requirements.txt
          LOAD_MODEL_ON_STARTUP=false /tmp/lean/bin/python -c "import backend.main, backend.predict, backend.artifacts; print('lean import OK')"
          ! /tmp/lean/bin/python -c "import torch" 2>/dev/null
