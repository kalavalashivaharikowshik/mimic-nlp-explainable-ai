name: Deploy to Hugging Face Spaces

# Runs after every push to main, once the repository secret HF_TOKEN and the
# repository variable HF_SPACE (e.g. "your-username/icu-mortality-xai") exist.
# See README -> Deployment.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
      MODEL_HF_REPO: ${{ vars.MODEL_HF_REPO }}
      MODEL_URL: ${{ vars.MODEL_URL }}
      MODEL_SHA256: ${{ vars.MODEL_SHA256 }}
      THRESHOLD: ${{ vars.THRESHOLD }}
    steps:
      - name: Skip when deployment is not configured
        if: env.HF_TOKEN == '' || env.HF_SPACE == ''
        run: echo "::notice::HF_TOKEN secret or HF_SPACE variable not set - skipping deployment."

      - uses: actions/checkout@v4
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''

      - uses: actions/setup-python@v5
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
        with:
          python-version: "3.11"

      - name: Push to Space
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
        run: |
          pip install "huggingface_hub>=0.26,<1"
          python deploy/push_to_space.py
