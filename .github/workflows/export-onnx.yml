name: Export ONNX model

# Converts the trained PyTorch weights (MODEL_URL, Google Drive by default) into
# ONNX Runtime artefacts and publishes them as a GitHub release. The web server
# downloads them from:
#   https://github.com/<owner>/<repo>/releases/download/<tag>/<file>
#
# Run it from the Actions tab: "Export ONNX model" -> "Run workflow".

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish the model under
        default: model-v1
        required: true
      model_url:
        description: URL of hybrid_model.pth (leave empty for the default Google Drive link)
        required: false

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ml.txt

      - name: Install export dependencies (CPU-only PyTorch)
        run: pip install -r requirements-ml.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Download weights and export to ONNX
        env:
          MODEL_URL: ${{ inputs.model_url }}
        run: |
          if [ -z "$MODEL_URL" ]; then unset MODEL_URL; fi
          python -m tools.export_onnx --download --out dist/onnx
          ls -la dist/onnx
          cat dist/onnx/manifest.json

      - name: Smoke-test the exported model with the lean server requirements
        run: |
          python -m venv /tmp/rt
          /tmp/rt/bin/pip install -q -r backend/requirements.txt
          ONNX_DIR=dist/onnx MODEL_BASE_URL="" /tmp/rt/bin/python - <<'PY'
          from backend.artifacts import load_artifacts
          from backend.predict import MortalityPredictor
          from backend import config
          p = MortalityPredictor(load_artifacts(config.ONNX_DIR, base_url=""))
          for text, feats in [
              ("patient stable, vitals within normal range, no signs of infection", [45, 0, 76, 122, 78, 93, 98, 0.9, 104, 14.1]),
              ("septic shock on norepinephrine, intubated, acute kidney injury", [78, 1, 122, 84, 46, 58, 87, 3.1, 248, 8.2]),
          ]:
              r = p.predict(text, feats)
              print(r["prediction"], round(r["probability"], 4), r["explanation"]["important_words"][:5])
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY' > notes.md
          import json
          m = json.load(open("dist/onnx/manifest.json"))
          print("ONNX Runtime artefacts for the web app (generated by the Export ONNX model workflow).\n")
          print(f"- text model: `{m['text_model']}`, max length {m['max_length']}, lowercase {m['lowercase_text']}")
          print(f"- default encoder: `{m['default_encoder']}`")
          print(f"- parity vs PyTorch (max abs probability diff): {m['parity_max_abs_diff']}\n")
          print("| file | size | sha256 |\n|---|---|---|")
          for name, info in m["files"].items():
              print(f"| {name} | {info['bytes'] / 1e6:.1f} MB | `{info['sha256']}` |")
          print("\nThe model was trained on MIMIC data; use is subject to the PhysioNet Credentialed Health Data Use Agreement. Research use only, not for clinical decisions.")
          PY
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/onnx/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/onnx/* --title "ONNX model ($TAG)" --notes-file notes.md
          fi
